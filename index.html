<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISON Automation - Tank Monitor</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
    .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    h1 { color: #333; font-size: 24px; }
    .branding { color: #555; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
    .level { font-size: 48px; font-weight: bold; color: #007BFF; margin: 20px 0; }
    .status { font-size: 24px; padding: 10px; border-radius: 8px; color: white; }
    .motor-on { background-color: #28a745; }
    .motor-off { background-color: #dc3545; }
  </style>
</head>
<body>

  <div class="card">
    <div class="branding">ISON Automation</div>
    <h1>Water Tank Monitor</h1>
    <p>Distance from sensor to water:</p>
    <div class="level" id="distanceDisplay">-- cm</div>
    
    <h2>Motor Status</h2>
    <div class="status motor-off" id="motorDisplay">OFF</div>
  </div>

  <script>
    // 1. REPLACE THESE WITH YOUR FIREBASE WEB CONFIG KEYS
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 2. Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 3. Listen for Distance Updates in Real-Time
    const distanceRef = database.ref('/tank/distance');
    distanceRef.on('value', (snapshot) => {
      const distance = snapshot.val();
      document.getElementById('distanceDisplay').innerText = distance + ' cm';
    });

    // 4. Listen for Motor Status Updates in Real-Time
    const motorRef = database.ref('/tank/motorState');
    motorRef.on('value', (snapshot) => {
      const isMotorOn = snapshot.val();
      const motorDiv = document.getElementById('motorDisplay');
      
      if (isMotorOn) {
        motorDiv.innerText = 'ON (Filling)';
        motorDiv.className = 'status motor-on';
      } else {
        motorDiv.innerText = 'OFF';
        motorDiv.className = 'status motor-off';
      }
    });
  </script>

</body>
</html>
